name: Publish StackBlitz Demo

on:
  push:
    branches: [master, feat/**]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm i -D @stackblitz/sdk
      - run: node scripts/publish-stackblitz.js